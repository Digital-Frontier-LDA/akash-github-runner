name: Akash runner CI conformance
description: Validate a consumer workflow against the leak-safe DF Akash runner lifecycle.

# ⛔ EVERY RULE IN akash_runner/ MUST APPEAR IN THIS FILE. Measured 2026-08-24: three
# merged, tested rules — check_pool_owns_teardown, check_dereg_backstop and
# check_reaper_schedule — were invoked by NOBODY, because this action ran only
# check_standard.py. A green conformance check certified one quarter of the standard and
# read as certifying all of it. Their passing test suites are what made it invisible:
# a test proves the rule WORKS; only the call site proves it RUNS.
#
# `akash_runner/test_every_rule_has_a_call_site.py` now fails if a `check_*.py` is neither
# invoked below nor listed there with a stated reason. That test is the fix; the wiring
# below is only the backlog.

inputs:
  workflow:
    description: >-
      Workflow file containing pool, work, and teardown jobs. OPTIONAL: several rules
      judge the DIRECTORY and need no single file, so a repo with no canonical-pool
      consumer — one that only hosts the reusables, say — can still run the repo-scoped
      half. Omitting it SKIPS the workflow-scoped rules and says so at warning level; it
      does not pass them. The exact set is listed in WORKFLOW_SCOPED_ENFORCING /
      WORKFLOW_SCOPED_ADVISORY below and named in the skip warning; do not restate it
      here, it drifts.
    required: false
    default: ""
  target-kind:
    description: >-
      What the `workflow` file IS, when auto-detection would judge it against the wrong
      contract. Passed straight through to check_standard.py, which owns the vocabulary
      and validates the claim.

      ⛔ THE CATEGORY EXISTED AND NO CONSUMER COULD SELECT IT. check_standard has judged
      three shapes since #11 — consumer, pool, and lease-spender (a repo that spends on
      leases with its own provisioner rather than calling the canonical pool). This
      action invoked it with no kind at all, so every caller got `auto`, and `auto` errs
      toward consumer mode. A lease-spender therefore failed with "no canonical
      just-akash runner-pool reusable job found" — a PERMANENT RED naming a rule the
      repo was never in scope for. Measured on Blazing-Back (#1628): it is a
      lease-spender, and had to choose between that red and omitting `workflow`
      entirely, which silently drops the workflow-scoped rules that DO apply to it.

      ⚠ THIS PARAGRAPH USED TO NAME df-cicd AS THE SECOND LEASE-SPENDER, and
      contradicted line ~234 of this same file ("df-cicd / agr / df-wiki
      NOT-JUDGEABLE (exit 3) — they provision nothing"). Re-measured 2026-08-30
      against df-cicd@origin/main: ZERO uncommented lease-provisioning calls in any
      workflow — `df-akash-gate.yml`'s `just-akash deploy` is commented out, and its
      own runner-conformance.yml deliberately sets `workflow: ""`. df-cicd is the
      FOURTH shape (no runner workflow at all), not a lease-spender. The live
      lease-spenders measured today are `blazing` and `Blazing-Back`.
      check_teardown_can_identify PASSES non-vacuously on Blazing-Back — 9 run-steps
      examined — and was being thrown away to dodge an inapplicable finding.

      ⚠ Declaring a kind is a CLAIM, not an exemption: check_standard verifies it and
      reports a finding when the evidence contradicts it (a file declaring
      lease-spender with no lease lifecycle is mislabelled, and says so). Leave unset
      unless a rule is judging the file against a contract it does not have.
    required: false
    default: ""
  workflows-dir:
    description: >-
      The consumer's .github/workflows directory. Several rules judge the REPO rather
      than a single file — a backstop reaper is a property of the repo, not of any one
      workflow — and they are skipped, loudly, when this is absent. The exact set (and
      which of them are enforcing) is listed in DIR_SCOPED_ENFORCING / DIR_SCOPED_ADVISORY
      below and named in the skip warning; do not restate it here, it drifts.
    required: false
    default: ""
  not-judgeable:
    description: >-
      What to do when a rule exits 3 — NOT-JUDGEABLE: it ran, was called correctly, and its
      population was empty, so it observed nothing.

      ⛔ `error` (the DEFAULT) preserves today's behaviour exactly: an unjudgeable ENFORCING
      rule already failed the build, because its floor returned 1. Defaulting to `warn` would
      turn previously-red builds green — the one direction that breaks a consumer silently,
      and this action is consumed cross-org by repos we do not own.

      `warn` suits a repo that legitimately has nothing for a rule to judge — one that
      provisions no runners, say. That is the CALLER's knowledge; a rule cannot have it.
    required: false
    default: 'error'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
        TARGET_KIND: ${{ inputs.target-kind }}
      run: |
        set -euo pipefail
        python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
        ROOT="$GITHUB_ACTION_PATH/../../../akash_runner"
        NOT_JUDGEABLE_POLICY="${{ inputs.not-judgeable }}"

        # ⛔ EVERY RULE RUNS, AND EVERY STATUS IS KEPT. `set -e` would stop at the first
        # failure and a consumer would fix one rule, re-run, and meet the next — so each
        # invocation is guarded and the action fails once at the end with everything named.
        rc=0

        # ⛔ SINGLE SOURCE OF TRUTH FOR THE WORKFLOW-SCOPED RULES. Same contract as the
        # dir-scoped arrays below: the skip warning is BUILT from these, never retyped,
        # and akash_runner/test_skipped_rules_are_announced.py pins the RELATIONSHIP.
        WORKFLOW_SCOPED_ENFORCING=(
          check_standard.py
          check_teardown_can_identify.py
        )
        WORKFLOW_SCOPED_ADVISORY=(
          check_pool_owns_teardown.py
        )

        # ── ADVISORY ──────────────────────────────────────────────────────────────────
        # ⚠ REPORTED, NOT ENFORCED — ON PURPOSE, AND NOT FOREVER. These three have never
        # judged a consumer. Turning them on at full strength would fail real repos on
        # their next run for defects that have been latent for weeks, and at least one
        # would fail a repo that is correct today: check_pool_owns_teardown requires an
        # unconditional teardown on the premise that "an empty identity is a safe no-op",
        # which is TRUE for just-akash (runner-teardown.yml:140 no-ops) and FALSE for
        # Blazing-Back (ci_close_akash_deployment.sh:43 exits 1). Enforcing before that
        # repo can comply converts a silent gap into a broken pipeline.
        # ⇒ Advisory first so the blast radius is MEASURED, then promoted. The promotion
        # criteria live in the test file beside the reason, so "temporary" has a
        # definition instead of being whatever nobody got round to.
        # ⛔ EXIT 3 IS "NOT-JUDGEABLE": the rule ran, was called correctly, and its population
        # was EMPTY — it observed nothing. Neither a pass nor a finding. Before this it shared
        # exit 1 with real defects, so a fleet sweep could not separate "this rule does not
        # apply here" from "this repo is broken" without reading prose.
        # ⚠ NOT exit 2: argparse uses 2 for an unrecognised flag, and rules already use 2 for
        # "not a directory" — 2 cannot distinguish "I could not judge" from "you called me wrong".
        #
        # ⚠ THE ENFORCING CALL SITES BELOW DELIBERATELY KEEP `|| rc=1` AND ARE NOT CONVERTED.
        # Three tests pin that literal (test_every_rule_has_a_call_site.py:348 by regex,
        # test_teardown_can_identify.py:191 by string, test_skipped_rules_are_announced.py by
        # reasoning). `|| rc=1` is how the suite PROVES a rule is enforcing; a wrapper would
        # trade that guarantee for this one. Exit 3 is non-zero, so an enforcing rule that
        # judged nothing still fails the build exactly as before — which is what backward
        # compatibility requires. Converting them is a separate change with its own tests.
        advisory() {
          local script="$1"; shift
          local rc_local=0
          python3 "$ROOT/$script" "$@" || rc_local=$?
          if [ "$rc_local" -eq 0 ]; then
            echo "advisory ${script}: PASS"
          elif [ "$rc_local" -eq 3 ]; then
            if [ "${NOT_JUDGEABLE_POLICY:-error}" = "warn" ]; then
              echo "::notice title=NOT-JUDGEABLE — ${script}::Observed nothing here, and this repo declares that acceptable. NOT a pass."
            else
              echo "::warning title=NOT-JUDGEABLE — ${script}::Observed nothing — an EMPTY population, not a clean one. Advisory, so the build is unaffected; set \`not-judgeable: warn\` if that is expected here."
            fi
          else
            echo "::warning title=ADVISORY — ${script} (not yet enforced, see #154)::This rule is not failing the build yet. Its findings are above. It will be promoted to enforcing once its blast radius across consumers has been measured."
          fi
        }

        # ⛔ AT LEAST ONE TARGET, OR THE ACTION JUDGES NOTHING AND EXITS 0. Both inputs
        # empty is the vacuous pass this repo exists to prevent: a green tick over an
        # empty verdict. Fail loudly instead.
        if [ -z "${WORKFLOW:-}" ] && [ -z "${WORKFLOWS_DIR:-}" ]; then
          echo "::error title=akash-runner-conformance judged NOTHING::Neither \`workflow\` nor \`workflows-dir\` was supplied, so every rule was skipped and this job would have passed without examining anything. Supply at least one."
          exit 1
        fi

        # ── ENFORCING / ADVISORY, workflow-scoped ─────────────────────────────────────
        if [ -n "${WORKFLOW:-}" ]; then
          # ⚠ Built as an ARRAY, not interpolated into the command line: an empty
          #   TARGET_KIND must contribute NO argument at all. `--target-kind ""` is not
          #   the same as omitting it — argparse would reject the empty string against
          #   its choices and every existing caller (all of which leave this unset)
          #   would start failing on a flag they never passed.
          KIND_ARGS=()
          if [ -n "${TARGET_KIND:-}" ]; then
            KIND_ARGS=(--target-kind "$TARGET_KIND")
          fi
          python3 "$ROOT/check_standard.py" "${KIND_ARGS[@]}" -- "$WORKFLOW" || rc=1
          # A teardown that always runs and receives nothing is reachable, and inert. The
          # shape check above cannot see WHEN the lease identity is published; this one can.
          # Measured: it separates just-akash before and after 53515bc, and rejects the
          # Blazing-Back#1468 shape that billed two deployments for 32 hours.
          python3 "$ROOT/check_teardown_can_identify.py" "$WORKFLOW" || rc=1
          advisory check_pool_owns_teardown.py "$WORKFLOW"
        else
          # Same reasoning as the dir-scoped announcement below: a skipped rule that
          # reports nothing is indistinguishable from one that passed, and two of these
          # FAIL THE BUILD when they run.
          printf -v wf_skipped_enforcing '%s, ' "${WORKFLOW_SCOPED_ENFORCING[@]}"
          printf -v wf_skipped_advisory  '%s, ' "${WORKFLOW_SCOPED_ADVISORY[@]}"
          wf_skipped_enforcing=${wf_skipped_enforcing%, }
          wf_skipped_advisory=${wf_skipped_advisory%, }
          wf_skipped_total=$(( ${#WORKFLOW_SCOPED_ENFORCING[@]} + ${#WORKFLOW_SCOPED_ADVISORY[@]} ))
          echo "::warning title=${wf_skipped_total} workflow-scoped rules were NOT run::No \`workflow\` input was supplied, so ${wf_skipped_total} rules that judge a SINGLE workflow file were SKIPPED, not passed. ${#WORKFLOW_SCOPED_ENFORCING[@]} of them are ENFORCING and would fail this build if they ran: ${wf_skipped_enforcing}. The rest are advisory: ${wf_skipped_advisory}. This job's green tick does NOT cover them. Pass \`workflow: <path>\` to run them."
        fi

        # ⛔ SINGLE SOURCE OF TRUTH FOR THE DIR-SCOPED RULES. The skip warning below is
        # BUILT from these two arrays, never retyped. The previous notice was a
        # hand-written sentence naming two rules -- true when written, and still saying
        # "2 repo-scoped rules" after eight more had been added to the branch beside it.
        # Three of the eight were ENFORCING, so a consumer with no `workflows-dir` was
        # told two advisory-sounding rules were skipped while three build-failing rules
        # silently never ran, and the job went green.
        #
        # `akash_runner/test_skipped_rules_are_announced.py` pins the RELATIONSHIP rather
        # than the sentence: these arrays must equal the rules actually invoked below,
        # DIR_SCOPED_ENFORCING must equal exactly those invoked with `|| rc=1`, and the
        # warning must expand the arrays instead of naming anything by hand. Add rule
        # eleven without touching these and that test fails.
        DIR_SCOPED_ENFORCING=(
          check_escrow_reaper_is_adopted.py
          check_disable_auto_update_absent.py
          check_dereg_backstop.py
          check_backstop_covers_producers.py
          check_context_properties_exist.py
        )
        DIR_SCOPED_ADVISORY=(
          check_provisioning_is_delegated.py
          check_reaper_schedule.py
          check_funding_gate_is_not_re_derived.py
          check_gate_is_not_re_derived.py
          check_schedule_inputs_are_empty.py
          check_unvalidated_default.py
          check_funding_projection_is_quantised.py
          check_teardown_cannot_be_silenced.py
          check_test_pins_a_literal.py
          check_pool_not_before_consumers.py
          check_runner_image_digest_floor.py
          check_conformance_pin_agrees_with_checker_ref.py
          check_listing_failure_is_loud.py
          check_stale_runner_reaper_is_adopted.py
          check_auto_update_pump_has_a_bound.py
        )

        if [ -n "${WORKFLOWS_DIR:-}" ]; then
          # ⭐ PROMOTED TO ENFORCING 2026-08-24. Its advisory period did exactly what an
          # advisory period is for: the first run found a FALSE POSITIVE against df-cicd
          # itself, and following it up found a SECOND against blazing. Both are fixed —
          # the rule now asks whether a repo CREATES registrations, and it follows a
          # reaper that delegates to a shell script. Swept all 5 consumers named in
          # CONSUMERS.md: 5 PASS, 0 outstanding findings.
          python3 "$ROOT/check_dereg_backstop.py" "$WORKFLOWS_DIR" || rc=1
          advisory check_reaper_schedule.py "$WORKFLOWS_DIR"
          # ⚠ ADVISORY ON ARRIVAL — blast radius MEASURED, not assumed (2026-08-29):
          #   blazing       FAIL >=3  akash-ci.yml, akash-integration-new.yml, akash-runner.yml
          #   Blazing-Back  FAIL   2  akash-runner.yml, runner-time-to-ready.yml
          #   df-cicd / agr / df-wiki   NOT-JUDGEABLE (exit 3) — they provision nothing
          # Promotion to enforcing needs BOTH halves, and the second is the one usually
          # forgotten: the consumer must fix its workflows AND move its pin past this rule.
          # "Goes green on blazing" alone is UNREACHABLE while blazing pins a SHA predating
          # the rule — that exact unreachable phrasing has been written here twice.
          advisory check_provisioning_is_delegated.py "$WORKFLOWS_DIR"
          # ⚠ ADVISORY ON ARRIVAL, AND IT FAILS EVERY IN-SCOPE REPO INCLUDING THIS ONE.
          # Blast radius MEASURED 2026-08-30 BEFORE wiring, which is what the promotion
          # protocol requires:
          #   DigitalFrontier-infra  FAIL  akash-runner.yml, runner-time-to-ready.yml create
          #                                deployments; nothing adopts the reaper
          #   just-akash             FAIL  provider-canary.yml
          #   akash-github-runner    NOT APPLICABLE — its only `just-akash deploy` is
          #                                 df-akash-gate.yml:75, a COMMENTED-OUT sketch.
          #                                 ⚠ The first measurement counted this repo as
          #                                 FAILING; the rule was reading its own comments
          #                                 as evidence. Fixing that moved it out of scope.
          #   df-wiki                NOT APPLICABLE — creates no deployments
          # 2 of 2 in-scope repos fail, and that is the FINDING rather than a defect in the
          # rule: the canonical workflow landed in the same change, so no consumer has had a
          # SHA to pin yet. Enforcing now would red every consumer for a state they had no
          # opportunity to reach. PROMOTE WHEN all three adopt it at a pinned SHA.
          python3 "$ROOT/check_escrow_reaper_is_adopted.py" "$WORKFLOWS_DIR" || rc=1
          # ⛔ FUNDING IS A SHARED DECISION, NOT A PER-REPO ONE. akash-lease-core v0.8.0
          # answers it once — quantised, naming WHICH quantity it read, three outcomes,
          # max(SLOT) never the sum. This rule fails a consumer that re-derives it from
          # raw numbers. ADVISORY: it fails Blazing-Back today by design, and enforcing
          # before any consumer has adopted the primitive would red every runner workflow.
          advisory check_funding_gate_is_not_re_derived.py "$WORKFLOWS_DIR"
          # ⛔ THE SAME DEFECT, ONE CLOUD OVER. A gate that re-derives a verdict the
          # shared primitive already answers is not a funding problem — it recurs per
          # cloud, and copying the rule per cloud is that mistake one level up. This rule
          # is registry-driven (akash_runner/gate_registry.py) and every gate in it is
          # additionally checked for the CROSS-CUTTING #1113 shape: reporting a SHORTAGE
          # on a path an instrument FAILURE also reaches. Observed on three artefacts
          # across two clouds; a per-cloud rule cannot see that, because each author
          # meets it once.
          #
          # ⚠ INVOKED AS --gate capacity, NOT --gate all. check_funding_gate_is_not_re_
          # derived.py above still owns funding and carries its own promotion condition,
          # which is still pending; running both over funding would double-report and
          # collapsing them now would discard that record. Collapse when funding promotes.
          advisory check_gate_is_not_re_derived.py --gate capacity "$WORKFLOWS_DIR"
          # ⛔ EXISTENCE IS NOT COVERAGE. check_dereg_backstop above asks whether a
          # scheduled dereg EXISTS; this asks whether it reaps what the repo EMITS.
          #
          # ENFORCING since 2026-08-24. Its promotion condition was "every consumer's
          # emitted prefixes are covered by its backstop, BY ANY ROUTE" — measured met:
          #   blazing       21 workflows  PASS  (producers emit df-flow-*, backstop
          #                                      filters startswith("df-flow-"))
          #   Blazing-Back  56 workflows  PASS  (producers emit df-core-, reaper
          #                                      PREFIXES: df-core-)
          # Both closed the gap by renaming producers onto a covered stem, NOT by
          # widening a reaper — which is why the condition names a STATE and not a
          # remedy (#161). A known-positive control confirms the rule still fails:
          # a synthetic producer emitting an uncovered prefix exits 1.
          python3 "$ROOT/check_backstop_covers_producers.py" "$WORKFLOWS_DIR" || rc=1
          # A schedule supplies NO inputs, so `inputs.X || 'false'` silently means
          # "destroy" on every cron firing. Blazing-Back's cleanup-stale-akash.yml
          # carried exactly that on a 6-hourly destructive job.
          advisory check_schedule_inputs_are_empty.py --workflows-dir "$WORKFLOWS_DIR"
          # A context property that does not exist resolves to the EMPTY STRING,
          # silently — measured twice (just-akash #182 github.organization; #184
          # job.workflow_sha/workflow_repository pinned every runner checkout to
          # main's tip). Checks the CLOSED vocabularies (job/runner/strategy) and
          # the documented github.* leaves; open vocabularies are deliberately
          # untouched.
          #
          # ⭐ PROMOTED TO ENFORCING 2026-08-24 (#163). The PROMOTE WHEN condition
          # was "every current consumer's workflows-dir has been scanned and
          # every finding is either fixed or exempted-with-a-reason — i.e. the
          # rule's blast radius across consumers is zero-unexplained, not merely
          # unmeasured." Measured met: DigitalFrontier-infra PASS (56 workflows),
          # Borduas-Holdings/blazing PASS (21 workflows, fresh sparse clone),
          # df-cicd PASS (25 workflows, own workflows-dir). Known-positive
          # synthetic workflow with `${{ job.workflow_sha }}` still exits 1,
          # proving the rule is not inert. Precedent: #162, promoted on the same
          # shape (blazing 21 PASS + Blazing-Back 56 PASS + known-positive exit
          # 1). The rule's scope is documented in
          # akash_runner/test_every_rule_has_a_call_site.py (ENFORCING entry).
          python3 "$ROOT/check_context_properties_exist.py" --workflows-dir "$WORKFLOWS_DIR" || rc=1
          # ⛔ ${VAR:-default} substitutes ONLY when VAR is unset or EMPTY — a
          # non-numeric set value like `abc` passes straight through and reaches
          # the numeric comparison as `abc`, a bash SYNTAX ERROR. Measured today
          # on DigitalFrontier-infra: akash-runner.yml:328 MIN_UACT and
          # ci-pr.yml:4747 MIN_AGE_HOURS. The rule's scope is documented in
          # akash_runner/test_every_rule_has_a_call_site.py (ADVISORY entry).
          advisory check_unvalidated_default.py --workflows-dir "$WORKFLOWS_DIR"
          advisory check_funding_projection_is_quantised.py --workflows-dir "$WORKFLOWS_DIR"
          advisory check_teardown_cannot_be_silenced.py --workflows-dir "$WORKFLOWS_DIR"
          # ⛔ `uses:@sha` picks the CONTRACT, `checker-ref` picks the CHECKER. Two
          # declarations of one decision, and the invariant lived only in a comment in
          # the caller's own file. A half-bump runs an old contract against a new
          # checker (or the reverse); both SHAs resolve and the job goes green, so
          # nothing else reports it. Measured 2026-08-25: both consumers had a STALE
          # pin (df-cicd#186, just-akash#209) — this rule catches the repair going
          # half-done, which is the likely next instance now that both were bumped by
          # hand. ⚠ It checks AGREEMENT, not CURRENCY: staleness needs the upstream
          # default branch, which a local rule cannot see.
          advisory check_conformance_pin_agrees_with_checker_ref.py "$WORKFLOWS_DIR"
          # ⛔ A test that pins the SHAPE of the defect it is supposed to detect
          # — assertion body holds the literal `job.workflow_sha` /
          # `./.github/actions/foo` while the message describes a general
          # property. Three measured regressions in one day (just-akash #184,
          # df-cicd #149, DEVOPS blank-prefix). The rule flags only body-pin +
          # property-message pairs; precision words (`exactly`, `must equal`)
          # keep fixture-style assertions out of scope. The rule's scope is
          # documented in akash_runner/test_every_rule_has_a_call_site.py
          # (ADVISORY entry).
          advisory check_test_pins_a_literal.py --workflows-dir "$WORKFLOWS_DIR"
          advisory check_pool_not_before_consumers.py --workflows-dir "$WORKFLOWS_DIR"
          # ⛔ BLOCKING, NOT ADVISORY — this is the rule that would have stopped the
          # 2026-08-26 outage. A runner with DISABLE_AUTO_UPDATE set REGISTERS and then
          # receives no jobs; the supervisor restarts it, so one dead lease emits a
          # registration every ~15s. Measured on just-akash deployment 1787733947684.
          #
          # It is blocking where check_runner_image_digest_floor stays advisory because
          # the two answer different questions. A VERSION FLOOR passes at merge and rots:
          # GitHub deprecates on a DATE, so today's compliant image is tomorrow's outage
          # with no code change. AUTO-UPDATE is the only control that survives the NEXT
          # deprecation, and its absence is a binary, statically-checkable fact that no
          # digest opacity can hide.
          python3 "$ROOT/check_disable_auto_update_absent.py" --workflows-dir "$WORKFLOWS_DIR" || rc=1
          advisory check_runner_image_digest_floor.py --workflows-dir "$WORKFLOWS_DIR"
          # ⛔ A LISTING THAT SWALLOWS ITS OWN FAILURE REPORTS A CLEAN SWEEP. `|| true` /
          # `2>/dev/null` on the org runner listing turns a 403 into an empty population,
          # and an empty population is indistinguishable from "nothing to reap" — the reaper
          # exits 0 having judged nothing. Measured 2026-08-29: 6,479 offline registrations
          # in Borduas-Holdings while an hourly sweeper reported success.
          # ⚠ ADVISORY, not enforcing: df-cicd's FORK of the reusable reaper FAILS this rule
          # today (measured, 1 finding). Enforcing would red a consumer for a defect nobody
          # has fixed there yet. Promotion condition is in the ADVISORY entry in
          # akash_runner/test_every_rule_has_a_call_site.py.
          advisory check_listing_failure_is_loud.py --workflows-dir "$WORKFLOWS_DIR"
          advisory check_stale_runner_reaper_is_adopted.py --workflows-dir "$WORKFLOWS_DIR"
          # Bounds the pump the auto-update mandate creates; rationale in the rule docstring.
          advisory check_auto_update_pump_has_a_bound.py --workflows-dir "$WORKFLOWS_DIR"
        else
          # ⛔ SAY SO, SAY ALL OF IT, AND SAY IT LOUD ENOUGH TO SEE. A skipped rule that
          # reports nothing is indistinguishable from a rule that passed. `::notice` is
          # the quietest annotation GitHub has and does not surface in the checks UI the
          # way a warning does -- which is why an undercount at notice level stayed
          # invisible. Some of these rules FAIL THE BUILD when they run, so their absence
          # is the difference between a green job that judged this repo and a green job
          # that did not.
          # `${arr[*]}` joins on the FIRST character of IFS only, so IFS=', ' yields
          # "a,b,c" with no spaces. printf + trim gives a readable list.
          printf -v skipped_enforcing '%s, ' "${DIR_SCOPED_ENFORCING[@]}"
          printf -v skipped_advisory  '%s, ' "${DIR_SCOPED_ADVISORY[@]}"
          skipped_enforcing=${skipped_enforcing%, }
          skipped_advisory=${skipped_advisory%, }
          skipped_total=$(( ${#DIR_SCOPED_ENFORCING[@]} + ${#DIR_SCOPED_ADVISORY[@]} ))
          echo "::warning title=${skipped_total} repo-scoped rules were NOT run::No \`workflows-dir\` input was supplied, so ${skipped_total} rules that judge the .github/workflows DIRECTORY were SKIPPED, not passed. ${#DIR_SCOPED_ENFORCING[@]} of them are ENFORCING and would fail this build if they ran: ${skipped_enforcing}. The rest are advisory: ${skipped_advisory}. This job's green tick does NOT cover them. Pass \`workflows-dir: .github/workflows\` to run them."
        fi

        exit "$rc"
