# The offline half of check_no_pre_emudhra_runner_digest's ONE LEVEL OF INDIRECTION (df-cicd-rpi.10).
#
# The rule reads data/just_akash_pre_emudhra_workflow_refs.txt at consumer check time and never
# touches the network. Its named residual: a just-akash commit the file does not list passes. So
# a new just-akash commit (or a branch cut from an old one) that runs a pre-fix runner is
# invisible until the list is re-measured. THIS re-measures it: a mirror clone of just-akash
# (refs/pull/* included, since a consumer can pin a PR head), judged by the generator, which
# FAILS on any pre-fix pair the file does not list. A listed pair the mirror lacks is only noted:
# GitHub keeps serving a deleted branch's commit, so the list only grows.
#
# just-akash is public: the clone is anonymous and this job holds no credential.
name: just-akash refs

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - akash_runner/check_no_pre_emudhra_runner_digest.py
      - akash_runner/generate_just_akash_pre_emudhra_refs.py
      - akash_runner/data/just_akash_pre_emudhra_workflow_refs.txt
      - .github/workflows/just-akash-refs.yml

permissions:
  contents: read

concurrency:
  # Read-only: it provisions nothing, so a superseded run is safe to cancel.
  group: just-akash-refs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: just-akash pre-fix refs are all listed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Mirror just-akash (every ref, never shallow)
        run: git clone --quiet --mirror https://github.com/Digital-Frontier-LDA/just-akash "$RUNNER_TEMP/just-akash.git"

      - name: Every pre-fix (commit, workflow) is in the list
        run: python akash_runner/generate_just_akash_pre_emudhra_refs.py --repo "$RUNNER_TEMP/just-akash.git" --check
